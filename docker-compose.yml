services:
  uneed-user:
    build: .
    container_name: uneed-user
    restart: unless-stopped
    env_file: .env
    environment:
      - UNEED_HOST=0.0.0.0
      - UNEED_PORT=5000
    volumes:
      - uneed_data:/app/website_user/instance
      - uneed_instance:/app/instance
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Konsol developer — JANGAN dipublikasikan ke internet. Batasi ke localhost/VPN.
  uneed-dev:
    build: .
    container_name: uneed-dev
    restart: unless-stopped
    command: gunicorn -w 1 --threads 2 -b 0.0.0.0:5001 --timeout 60 website_dev.app_dev:app
    env_file: .env
    environment:
      - UNEED_DEV_HOST=0.0.0.0
      - UNEED_DEV_PORT=5001
    volumes:
      - uneed_data:/app/website_user/instance
      - uneed_instance:/app/instance
    ports:
      - "127.0.0.1:5001:5001"

  # Reverse proxy HTTPS. Sesuaikan certificate path pada produksi.
  # nginx:
  #   image: nginx:1.27-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - uneed-user

volumes:
  uneed_data:
  uneed_instance:
